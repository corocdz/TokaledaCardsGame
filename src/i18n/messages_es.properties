#PopUpAyudaController
ayuda.texto=Muy bonito todo peeeero\u2026 \u00bfc\u00f3mo se juega?\n\nSi es tu primera vez jugando, no te preocupes: \u00a1es s\u00faper f\u00e1cil!\n\nDesde el men\u00fa principal puedes elegir entre jugar Offline contra hasta 3 IAs, o jugar Online con hasta 3 amigos.\n\nEn Offline: selecciona cu\u00e1ntas IAs quieres y elige el modo.\nEn Online: cread una sala, compartid el c\u00f3digo y a jugar.\n\nMODOS DISPONIBLES:\n\u2022 Pescaito - Consigue cuartetos de un mismo n\u00famero. \u00a1Cuidado, pueden rob\u00e1rtelos!\n\u2022 Yusa - Todos ten\u00e9is 3 vidas. Pierde vida quien acabe con la carta m\u00e1s baja.\n   - El 1 permite preguntar por el palo de tu Yusa.\n   - El 12 bloquea los intercambios de cartas.\n\n\u00a1Ya est\u00e1s listo para jugar a Tokaleda Cards Game!


