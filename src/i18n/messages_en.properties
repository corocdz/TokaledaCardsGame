#PopUpAyudaController
ayuda.texto=Everything looks great buuut\u2026 how do you play?\n\nIf this is your first time, don\u2019t worry: it\u2019s super easy!\n\nFrom the main menu you can choose to play Offline against up to 3 AIs, or Online with up to 3 friends.\n\nOffline: choose how many AIs you want and select the game mode.\nOnline: create a room, share the code and password, and start playing.\n\nAVAILABLE MODES:\n\u2022 Pescaito - Collect sets of four cards with the same number. Watch out, they can steal them from you!\n\u2022 Yusa - Everyone starts with 3 lives. The player with the lowest card loses a life.\n   - The 1 lets you ask another player for the suit of your Yusa.\n   - The 12 blocks card exchanges for the whole round.\n\nYou\u2019re now ready to play Tokaleda Cards Game!


